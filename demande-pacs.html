<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Une question pour toi…</title>
<style>
  /* =========================================================================
     DESIGN — tu n'as pas besoin de toucher à cette partie.
     Palette « crépuscule → aube » : la scène se réchauffe à mesure
     qu'elle avance dans le quiz, jusqu'à la demande.
     ========================================================================= */
  :root{
    --bg-deep:#211531;
    --bg-warm:#5a223f;
    --gold:#e9b949;
    --gold-soft:#f2cf7a;
    --rose:#e58ba6;
    --blush:#f6d9e0;
    --cream:#fbf1e9;
    --muted:rgba(251,241,233,.62);
    --line:rgba(251,241,233,.16);
    --wrong:#f0a0a0;
    --warmth:0;               /* 0 → 1, piloté par le script */
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:var(--sans);
    color:var(--cream);
    background:var(--bg-deep);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  /* Fond : dégradé profond + halo chaud dont l'intensité suit --warmth */
  .bg{position:fixed;inset:0;z-index:-2;background:
      radial-gradient(120% 90% at 50% 8%, #33203f 0%, var(--bg-deep) 55%, #17101f 100%);}
  .glow{position:fixed;inset:0;z-index:-1;pointer-events:none;
    opacity:calc(.15 + var(--warmth) * .85);
    transition:opacity 1.1s ease;
    background:
      radial-gradient(90% 60% at 50% 92%, color-mix(in srgb, var(--bg-warm) 90%, transparent) 0%, transparent 62%),
      radial-gradient(50% 40% at 50% 78%, color-mix(in srgb, var(--gold) 34%, transparent) 0%, transparent 70%);}
  /* Cœurs qui dérivent doucement en fond */
  .hearts{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
  .hearts b{position:absolute;bottom:-40px;font-size:14px;color:var(--rose);opacity:0;
    animation:drift linear infinite}
  @keyframes drift{
    0%{transform:translateY(0) scale(.7);opacity:0}
    12%{opacity:.5}
    88%{opacity:.5}
    100%{transform:translateY(-108vh) scale(1);opacity:0}
  }

  .stage{min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:28px 20px calc(28px + env(safe-area-inset-bottom));}
  .card{width:100%;max-width:560px}

  .eyebrow{font-size:.74rem;letter-spacing:.28em;text-transform:uppercase;
    color:var(--gold-soft);margin:0 0 18px;font-weight:600}
  .display{font-family:var(--serif);font-weight:400;line-height:1.08;
    letter-spacing:-.01em;margin:0}
  h1.display{font-size:clamp(2.1rem,7vw,3.2rem)}
  .display em{font-style:italic;color:var(--rose)}
  .lede{color:var(--muted);font-size:1.02rem;line-height:1.65;margin:20px 0 0;
    max-width:44ch}

  /* Progression : chapelet de cœurs qui se remplit */
  .progress{display:flex;align-items:center;gap:9px;margin:0 0 26px}
  .progress .step{width:9px;height:9px;border-radius:50%;
    border:1.4px solid var(--line);transition:all .4s ease}
  .progress .step.done{background:var(--rose);border-color:var(--rose);
    box-shadow:0 0 10px color-mix(in srgb,var(--rose) 60%,transparent)}
  .progress .step.now{border-color:var(--gold);transform:scale(1.35)}
  .count{margin-left:auto;font-size:.78rem;letter-spacing:.1em;color:var(--muted)}

  .qtext{font-family:var(--serif);font-size:clamp(1.5rem,5vw,2rem);line-height:1.2;
    margin:0 0 26px;letter-spacing:-.01em}

  .options{display:flex;flex-direction:column;gap:12px}
  .opt{appearance:none;text-align:left;width:100%;cursor:pointer;
    font-family:var(--sans);font-size:1.02rem;color:var(--cream);
    background:rgba(251,241,233,.05);
    border:1.4px solid var(--line);border-radius:15px;
    padding:16px 18px;display:flex;align-items:center;gap:14px;
    transition:border-color .2s,background .2s,transform .1s}
  .opt .dot{flex:0 0 auto;width:22px;height:22px;border-radius:50%;
    border:1.4px solid var(--muted);display:grid;place-items:center;
    font-size:.7rem;color:var(--muted);transition:all .2s}
  .opt:hover{border-color:var(--rose);background:rgba(229,139,166,.10)}
  .opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .opt:active{transform:scale(.99)}
  .opt.correct{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,transparent)}
  .opt.correct .dot{border-color:var(--gold);background:var(--gold);color:#3a2a00}
  .opt.wrong{border-color:var(--wrong);animation:shake .38s}
  .opt.wrong .dot{border-color:var(--wrong);color:var(--wrong)}
  .opt.locked{pointer-events:none;opacity:.55}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
    40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

  .hint{min-height:1.4em;margin:16px 2px 0;font-size:.92rem;color:var(--rose);
    opacity:0;transition:opacity .25s}
  .hint.show{opacity:1}

  /* Boutons principaux */
  .btn{appearance:none;cursor:pointer;font-family:var(--sans);font-weight:600;
    font-size:1.05rem;color:#2a1500;border:none;border-radius:999px;
    padding:16px 30px;background:linear-gradient(180deg,var(--gold-soft),var(--gold));
    box-shadow:0 10px 30px rgba(233,185,73,.28);transition:transform .12s,box-shadow .2s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 38px rgba(233,185,73,.4)}
  .btn:active{transform:translateY(0)}
  .btn:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
  .btn.big{margin-top:30px;font-size:1.15rem;padding:18px 38px}
  .btn.ghost{background:none;color:var(--cream);border:1.4px solid var(--line);
    box-shadow:none;font-weight:500}
  .btn.ghost:hover{border-color:var(--rose);transform:translateY(-1px)}

  .doclink{display:inline-flex;align-items:center;gap:9px;margin-top:26px;
    color:var(--gold-soft);text-decoration:none;font-weight:600;
    border-bottom:1.4px solid color-mix(in srgb,var(--gold) 45%,transparent);
    padding-bottom:3px;transition:color .2s,border-color .2s}
  .doclink:hover{color:var(--cream);border-color:var(--cream)}

  .ps{margin-top:34px;font-size:.86rem;color:var(--muted);line-height:1.6;
    border-top:1px solid var(--line);padding-top:20px}

  /* Apparition des écrans */
  .screen{animation:rise .55s cubic-bezier(.2,.7,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  /* Pluie de cœurs de la fin */
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
  .confetti b{position:absolute;top:-30px;font-size:20px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) rotate(320deg);opacity:0}}

  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="glow"></div>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <main class="stage">
    <div class="card" id="app"><!-- injecté par le script --></div>
  </main>

<script>
/* ===========================================================================
   ✏️  CONFIG — C'EST LA SEULE PARTIE À MODIFIER.
   ---------------------------------------------------------------------------
   • prenom            : le prénom de ta copine.
   • questions[]       : chaque question a un texte, des propositions,
                         et l'index de la bonne réponse.
   • bonneReponse      : 0 = 1re proposition, 1 = 2e, 2 = 3e, etc.
   • indice            : petit mot affiché si elle se trompe (facultatif, "").
   • boutonLien        : l'adresse ouverte à la fin (les documents du PACS).
   =========================================================================== */
const CONFIG = {

  prenom: "Ma Céciloushe, mon coeur",                 // 👉 remplace par son prénom

  introTitre: "Merci pour ce Weekend, ...",
  introTexte: "... et pour te remercier pour tout le reste, ... vu que je suis un gars sympa, voici ZeQuizz...",
  boutonDemarrer: "Je commence",

  // Si true : elle doit retrouver la bonne réponse pour avancer.
  // La fin est donc toujours atteinte (aucun « échec »). Recommandé pour une demande 😊
  reessayerJusquauBonneReponse: true,

  questions: [
    {
      question: "La première chose que Kévin a faite le 16 août 2025 ?",
      propositions: ["Souhaité un Joyeux Anniversaire a sa soeur", "Se curer le Nez", "Je sais pas ?! il était où dailleur ?"],
      bonneReponse: 0,
      indice: "Repense à ce matin-là…"
    },
    {
      question: "Le moment préféré de Kévin dans The Office ?",
      propositions: ["Micheal et son - Stay alive", "Le repas chez Micheal", "The Office ? Késako ?"],
      bonneReponse: 1,
      indice: "Ca l'ai devenu un peu grace a toi ..."
    },
    {
      question: "Ton premier cadeau, fait tout innocemment en 2025 ?",
      propositions: ["Une plante", "Un porte-clée", "De la crème de marron ?"],
      bonneReponse: 1,
      indice: "Tu ne te doutais de rien (enfin si un peu) ... 😏"
    },
    {
      question: "Un endroit isolé, lors de notre séjour à la Réunion ?",
      propositions: ["Un Airbnb avec une sorte de roulotte avec pleine d'araignées ?", "3 cascades", "Le lit de Bébou"],
      bonneReponse: 1,
      indice: "Rien que nous deux..."
    },
    {
      question: "La place de ma femme ?",
      propositions: ["C'est la cuisine ! (avec moi)", "Chez sa mère (sans moi)", "A la pharmacie (avec Shara B)"],
      bonneReponse: 0,
      indice: "Un tout petit indice : elle est juste là. 💛"
    },
    {
      question: "Qui t'aime le plus ?",
      propositions: ["Bibou", "Le gars à coté", "박지민"],
      bonneReponse: 1,
      indice: "Tu connais la réponse par cœur. (je crois ^^')"
    },
    {
      question: "Le nom du premier ending de One Piece ?",
      propositions: ["ジュ ヌ セ パ", "オ ノ セッ トゥ ガレール", "オケ セ ボン ジェ コンプリ ク トゥ トゥ モック ドゥ モワ", "We Are!"],
      bonneReponse: 0,                 // « memories » (Maki Otsuki). « We Are! » est le 1er générique d'ouverture, piège 😉
      indice: "Ce n'est pas un générique de début…"
    },
  ],

  // ——— Écran de la demande ———
  finEyebrow: "Tu as tout retrouvé",
  finTitre: "Veux-tu voir ta récompense ?",
  finTexte: "Vas y clique !!!!!",
  boutonOui: "Oui ? ... Hum ? ... Késako ?",

  // ——— Écran après le « oui » ———
  ouiTitre: "Elle a dit ... oui ?",
  ouiTexte: "Alors on rend "nous " plus sérieux !",
  boutonDocs: "C'est quoi encore ce lien ?",

  // 👉 Le lien des documents officiels. Par défaut : la page PACS de service-public.fr
  //    (procédure complète + formulaires). Formulaire direct « déclaration conjointe » :
  //    https://www.formulaires.service-public.gouv.fr/gf/cerfa_15725.do
  boutonLien: "https://www.service-public.fr/particuliers/vosdroits/N144"
};

/* ===========================================================================
   MOTEUR — inutile de modifier en dessous.
   =========================================================================== */
const app = document.getElementById('app');
const root = document.documentElement;
const Q = CONFIG.questions;
let idx = 0;

function setWarmth(v){ root.style.setProperty('--warmth', Math.max(0, Math.min(1, v))); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* Cœurs de fond */
(function ambient(){
  const box = document.getElementById('hearts');
  for(let i=0;i<14;i++){
    const b=document.createElement('b'); b.textContent='♥';
    b.style.left=(Math.random()*100)+'%';
    b.style.fontSize=(10+Math.random()*16)+'px';
    b.style.animationDuration=(16+Math.random()*16)+'s';
    b.style.animationDelay=(-Math.random()*24)+'s';
    box.appendChild(b);
  }
})();

/* ——— Écran d'intro ——— */
function renderIntro(){
  setWarmth(0);
  app.innerHTML = `
    <div class="screen">
      <p class="eyebrow">Pour ${esc(CONFIG.prenom)}</p>
      <h1 class="display">${esc(CONFIG.introTitre)}</h1>
      <p class="lede">${esc(CONFIG.introTexte)}</p>
      <button class="btn big" id="start">${esc(CONFIG.boutonDemarrer)} →</button>
    </div>`;
  document.getElementById('start').onclick = () => { idx = 0; renderQuestion(); };
}

/* ——— Une question ——— */
function renderQuestion(){
  const q = Q[idx];
  setWarmth((idx) / Q.length);

  const steps = Q.map((_, i) =>
    `<span class="step ${i < idx ? 'done' : ''} ${i === idx ? 'now' : ''}"></span>`).join('');

  const opts = q.propositions.map((p, i) =>
    `<button class="opt" data-i="${i}">
       <span class="dot">${String.fromCharCode(65 + i)}</span>
       <span>${esc(p)}</span>
     </button>`).join('');

  app.innerHTML = `
    <div class="screen">
      <div class="progress">${steps}<span class="count">${idx + 1} / ${Q.length}</span></div>
      <p class="qtext">${esc(q.question)}</p>
      <div class="options">${opts}</div>
      <p class="hint" id="hint"></p>
    </div>`;

  const hint = document.getElementById('hint');
  app.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => {
      const i = +btn.dataset.i;
      if (i === q.bonneReponse){
        btn.classList.add('correct');
        app.querySelectorAll('.opt').forEach(b => b.classList.add('locked'));
        hint.classList.remove('show');
        setTimeout(() => { idx++; idx < Q.length ? renderQuestion() : renderReveal(); }, 780);
      } else {
        btn.classList.remove('wrong'); void btn.offsetWidth; // relance l'animation
        btn.classList.add('wrong');
        if (q.indice){ hint.textContent = q.indice; hint.classList.add('show'); }
        if (!CONFIG.reessayerJusquauBonneReponse){
          setTimeout(() => { idx++; idx < Q.length ? renderQuestion() : renderReveal(); }, 900);
        }
      }
    };
  });
}

/* ——— La demande ——— */
function renderReveal(){
  setWarmth(1);
  app.innerHTML = `
    <div class="screen">
      <p class="eyebrow">${esc(CONFIG.finEyebrow)}</p>
      <h1 class="display">${esc(CONFIG.finTitre.replace(/pacser/i, '<em>$&</em>'))}</h1>
      <p class="lede">${esc(CONFIG.finTexte)}</p>
      <button class="btn big" id="yes">${esc(CONFIG.boutonOui)} ♥</button>
    </div>`;
  document.getElementById('yes').onclick = () => { rainHearts(); renderYes(); };
}

/* ——— Après le oui ——— */
function renderYes(){
  app.innerHTML = `
    <div class="screen">
      <p class="eyebrow" style="color:var(--rose)">💍 &nbsp;C'est officiel</p>
      <h1 class="display"><em>${esc(CONFIG.ouiTitre)}</em></h1>
      <p class="lede">${esc(CONFIG.ouiTexte)}</p>
      <div>
        <a class="doclink" href="${encodeURI(CONFIG.boutonLien)}" target="_blank" rel="noopener">
          ${esc(CONFIG.boutonDocs)} ↗
        </a>
      </div>
      <p class="ps">Formulaires officiels utiles : déclaration conjointe (Cerfa 15725) et convention type (Cerfa 15726), sur service-public.fr.</p>
    </div>`;
}

/* Pluie de cœurs */
function rainHearts(){
  const box = document.createElement('div'); box.className = 'confetti';
  document.body.appendChild(box);
  const chars = ['♥','💛','💍','♥','✨'];
  for (let i = 0; i < 70; i++){
    const b = document.createElement('b');
    b.textContent = chars[i % chars.length];
    b.style.left = (Math.random()*100)+'%';
    b.style.fontSize = (14+Math.random()*20)+'px';
    b.style.animationDuration = (2.4+Math.random()*2.2)+'s';
    b.style.animationDelay = (Math.random()*0.7)+'s';
    box.appendChild(b);
  }
  setTimeout(() => box.remove(), 6000);
}

renderIntro();
</script>
</body>
</html>
